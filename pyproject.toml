[project]
name = "diskviz"
version = "0.1.0"
description = "DiskViz - Windows disk usage visualization tool"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "orjson>=3.12.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "xxhash>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
